name: Logcat

# Android Logcat profile (threadtime and -v time formats)
# Supports:
#   # threadtime format:
#   08-10 05:34:48.669   559   559 I SystemServerTiming: Initializing system service
#   08-10 12:00:00.123  1000  1001 D WifiService: Connected to network
#   05:34:48.670   559   620 E AudioFlinger: cannot open hw device
#   # -v time format:
#   10-23 15:19:23.255 I/SystemServerTiming(  546): Initializing system service
#   09-09 13:37:12.574 D/WifiService( 1000): Connected to network
#   05:34:48.670 E/AudioFlinger(  559): cannot open hw device
parser:
  type: regex
  patterns:
    # 1. threadtime format: [MM-DD ]HH:MM:SS.mmm PID TID Level Tag: Message
    - '^(?:(?P<time>(?:\d{2}-\d{2}\s+)?\d{2}:\d{2}:\d{2}\.\d{3}))\s+(?P<pid>\d+)\s+(?P<tid>\d+)\s+(?P<level>[VDIWEAFvdiweaf])\s+(?:(?P<tag>[^:\r\n]+?):\s+)?(?P<message>.*)$'
    # 2. time format: [MM-DD ]HH:MM:SS.mmm Level/Tag(PID): Message
    - '^(?:(?P<time>(?:\d{2}-\d{2}\s+)?\d{2}:\d{2}:\d{2}\.\d{3}))\s+(?P<level>[VDIWEAFvdiweaf])/(?P<tag>.+?)\(\s*(?P<pid>\d+)\):\s*(?P<message>.*)$'

columns:
  - field: time
    title: Time
    width: 18
    style: timestamp

  - field: pid
    title: PID
    width: 6
    style: muted

  - field: tid
    title: TID
    width: 6
    style: muted

  - field: level
    title: Lvl
    width: 5
    style: level
    colors:
      V: gray
      v: gray
      D: cyan
      d: cyan
      I: green
      i: green
      W: yellow
      w: yellow
      E: red
      e: red
      A: purple
      a: purple
      F: red
      f: red

  - field: tag
    title: Tag
    width: 20
    style: identifier

  - field: message
    title: Message
    width: 0
    style: primary
