name: Zephyr

# Zephyr RTOS log profile (Standard formatted and Minimal UART logging)
# Supports:
#   # Standard format:
#   [00:00:03.165,977] <err> ext_log_system: critical level log
#   [      5.182] <inf> fs_nvs: 16 Sectors of 4096 bytes
#   [   1.234] <dbg> Message without module
#   # Minimal format:
#   D: pmhw: wkup_pin_config
#   D: [ServiceManager] State Updated: 3
#   I: 16 Sectors of 4096 bytes
#   E: failed to create directory (-17)
#   # With optional host timestamp:
#   14:17:31:258 -> D: pmhw: wkup_pin_config
parser:
  type: regex
  patterns:
    # 1. Standard Zephyr verbose logging: [<uptime>] <<level>> [module:] message
    - '^\[\s*(?P<uptime>[^\]]+?)\s*\]\s+<(?P<level>[a-zA-Z]+)>\s+(?:(?P<module>[a-zA-Z0-9_.-]+):\s+)?(?P<message>.*)$'

    # 2. Minimal Zephyr with bracketed module: [<time> -> ]<level>: [<module>] message
    - '^(?:(?P<uptime>\d{2}:\d{2}:\d{2}[:.]\d{3})\s+->\s+)?(?P<level>[DIWE]):\s+\[(?P<module>[^\]]+)\]\s*:?\s*(?P<message>.*)$'

    # 3. Minimal Zephyr with identifier module: [<time> -> ]<level>: <module>: message
    - '^(?:(?P<uptime>\d{2}:\d{2}:\d{2}[:.]\d{3})\s+->\s+)?(?P<level>[DIWE]):\s+(?P<module>[a-zA-Z0-9_.-]+):\s+(?P<message>.*)$'

    # 4. Minimal Zephyr general message (no module): [<time> -> ]<level>: message
    - '^(?:(?P<uptime>\d{2}:\d{2}:\d{2}[:.]\d{3})\s+->\s+)?(?P<level>[DIWE]):\s+(?P<message>.*)$'

columns:
  - field: uptime
    title: Uptime
    width: 19
    style: uptime

  - field: level
    title: Level
    width: 7
    style: level
    colors:
      err: red
      wrn: yellow
      inf: cyan
      dbg: gray
      ERR: red
      WRN: yellow
      INF: cyan
      DBG: gray
      E: red
      W: yellow
      I: cyan
      D: gray
      e: red
      w: yellow
      i: cyan
      d: gray

  - field: module
    title: Module
    width: 22
    style: identifier

  - field: message
    title: Message
    width: 0
    style: primary
