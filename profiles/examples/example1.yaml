name: Example1

# Structured log format: [time][level][module] message
parser:
  type: regex
  pattern: '^\[(?P<time>[^\]]+)\]\[(?P<level>[^\]]+)\]\[(?P<module>[^\]]+)\]\s+(?P<message>.*)$'

columns:
  - field: time
    title: Time
    width: 14
    style: timestamp

  - field: level
    title: Level
    width: 8
    style: level
    colors:
      ERROR: red
      WARN: yellow
      INFO: blue

  - field: module
    title: Module
    width: 10
    style: identifier

  - field: message
    title: Message
    width: 0
    style: primary
